<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101522">
  <meta name="description" content="WEB COMPUTER – vlastný počítač priamo v prehliadači.">
  <title>WEB COMPUTER</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="boot-screen" class="boot-screen">
    <div class="boot-content">
      <div class="boot-logo">W<span>C</span></div>
      <div class="boot-name">WEB COMPUTER</div>
      <div class="boot-subtitle">Your computer. Your world.</div>
      <div class="boot-loader"><i></i></div>
      <div class="boot-status" id="boot-status">Starting system...</div>
    </div>
  </div>

  <main id="desktop" class="desktop hidden">
    <div class="desktop-shade"></div>
    <div id="desktop-icons" class="desktop-icons">
      <button class="desktop-icon" data-app="explorer"><span class="app-icon">📁</span><span>File Explorer</span></button>
      <button class="desktop-icon" data-app="notes"><span class="app-icon">📝</span><span>Notes</span></button>
      <button class="desktop-icon" data-app="calculator"><span class="app-icon">🧮</span><span>Calculator</span></button>
      <button class="desktop-icon" data-app="terminal"><span class="app-icon">⌘</span><span>Terminal</span></button>
      <button class="desktop-icon" data-app="settings"><span class="app-icon">⚙️</span><span>Settings</span></button>
    </div>
    <div id="window-layer" class="window-layer"></div>
    <section id="start-menu" class="start-menu glass hidden">
      <div class="start-search"><span>⌕</span><input id="app-search" placeholder="Search for apps..." autocomplete="off"></div>
      <div class="start-heading"><b>Pinned</b><span>All apps　›</span></div>
      <div id="pinned-apps" class="pinned-apps"></div>
      <div class="start-bottom"><div class="user-avatar">W</div><b>Local User</b><button id="power-button" title="Power">⏻</button></div>
    </section>
    <section id="quick-panel" class="quick-panel glass hidden">
      <div class="quick-grid">
        <button class="quick-toggle active" data-toggle="wifi">◉<small>Wi-Fi</small></button>
        <button class="quick-toggle active" data-toggle="bluetooth">ᛒ<small>Bluetooth</small></button>
        <button class="quick-toggle" data-toggle="airplane">✈<small>Airplane mode</small></button>
        <button class="quick-toggle active" data-toggle="night">☾<small>Night light</small></button>
      </div>
      <label class="range-label">Brightness <input id="brightness" type="range" min="50" max="120" value="100"></label>
      <label class="range-label">Volume <input id="volume" type="range" min="0" max="100" value="65"></label>
      <div class="quick-date" id="quick-date"></div>
    </section>
    <div id="notification" class="notification glass"></div>
    <footer class="taskbar">
      <div class="taskbar-left"><button id="weather-widget" class="weather-widget">☀️ <span>Local weather</span></button></div>
      <div class="taskbar-center">
        <button id="start-button" class="taskbar-button start-button" title="Start"><span class="windows-mark">▦</span></button>
        <button id="search-button" class="taskbar-button" title="Search">⌕</button>
        <div id="taskbar-apps" class="taskbar-apps"></div>
      </div>
      <div class="taskbar-right">
        <button id="quick-button" class="tray-button" title="Quick settings">⌃　◉　◖</button>
        <button id="clock-button" class="clock-button"><span id="clock">12:00</span><small id="date">21. 11. 2026</small></button>
      </div>
    </footer>
  </main>
  <script src="js/storage.js"></script>
  <script src="js/window-manager.js"></script>
  <script src="js/apps.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
